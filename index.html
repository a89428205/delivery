<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓全能決策演算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); 
            min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; 
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 25px; 
            max-width: 400px; width: 90%; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #d32f2f; margin-bottom: 20px; cursor: pointer; }
        .form-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; color: #444; }
        input { width: 45%; padding: 10px; border: 1px solid #ddd; border-radius: 10px; text-align: right; background: #fff; }
        #resultBox { 
            background: #fff3cd; padding: 20px; text-align: center; font-weight: bold; 
            margin-top: 20px; border-radius: 20px; border: 2px dashed #ffc107; font-size: 18px; color: #856404;
        }
        .hidden-params { display: none; background: #f9f9f9; padding: 10px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 onclick="document.getElementById('adv').style.display='block'">🐼 熊貓決策演算器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])" style="width:100%; margin-bottom:20px;">
    
    <div class="form-group"><label>💰 總金額：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>📍 藍點至店家 (km)：</label><input type="number" id="dist1" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>🛣️ 店家至顧客 (km)：</label><input type="number" id="dist2" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>🎁 小費：</label><input type="number" id="tips" value="15" oninput="calculate()"></div>
    <div class="form-group"><label>🔥 加碼：</label><input type="number" id="bonus" value="0" oninput="calculate()"></div>
    <div class="form-group"><label>📈 倍率：</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>

    <!-- 隱藏的校準區域 -->
    <div id="adv" class="hidden-params">
        <div class="form-group"><label>偵測高度：</label><input type="number" id="cropY" value="0.53"></div>
        <div class="form-group"><label>藍-店係數：</label><input type="number" id="factor1" value="0.0022"></div>
        <div class="form-group"><label>店-客係數：</label><input type="number" id="factor2" value="0.0023"></div>
        <div class="form-group"><label>遠端補償：</label><input type="number" id="offset2" value="0.4"></div>
    </div>

    <div id="resultBox" style="display:none;"></div>
</div>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image(); img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);

            const { data: { text } } = await Tesseract.recognize(canvas, 'eng', { tessedit_char_whitelist: '0123456789.' });
            const matches = text.match(/\d+(\.\d{1,2})?/);
            if (matches) document.getElementById('totalIncome').value = parseFloat(matches[0]);

            const mapData = ctx.getImageData(0, 0, canvas.width, canvas.height * 0.6).data;
            const f1 = parseFloat(document.getElementById('factor1').value), f2 = parseFloat(document.getElementById('factor2').value), off2 = parseFloat(document.getElementById('offset2').value);
            let b={x:0,y:0,c:0}, s={x:0,y:0,c:0}, c={x:0,y:0,c:0};

            for (let i = 0; i < mapData.length; i += 4) {
                const x = (i/4)%canvas.width, y = Math.floor((i/4)/canvas.width);
                const r=mapData[i], g=mapData[i+1], b_val=mapData[i+2];
                if (b_val > 150 && r < 100) { b.x += x; b.y += y; b.c++; }
                else if (r < 50 && g < 50 && b_val < 50) {
                    if (y < canvas.height * 0.3) { s.x += x; s.y += y; s.c++; }
                    else { c.x += x; c.y += y; c.c++; }
                }
            }
            if(b.c>10 && s.c>10) document.getElementById('dist1').value = (Math.hypot(b.x/b.c - s.x/s.c, b.y/b.c - s.y/s.c) * f1).toFixed(1);
            if(s.c>10 && c.c>10) document.getElementById('dist2').value = (Math.hypot(s.x/s.c - c.x/c.c, s.y/s.c - c.y/c.c) * f2 + off2).toFixed(1);
            calculate();
        };
    };
    reader.readAsDataURL(file);
}

function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const d1 = parseFloat(document.getElementById('dist1').value) || 0, d2 = parseFloat(document.getElementById('dist2').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0, bonus = parseFloat(document.getElementById('bonus').value) || 0, mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    const totalDist = d1 + d2;
    const basePay = (inc + tips + bonus - 10) / mult;
    const efficiency = totalDist > 0 ? (basePay / totalDist) : 0;
    
    let msg = efficiency >= 10 ? "✅ 去去去" : (efficiency >= 6 ? "⚠️ 有點硬" : "❌ 拒拒拒");
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.innerHTML = `總距離：${totalDist.toFixed(1)} km<br>每公里配送費：${efficiency.toFixed(1)} 元/km<br>${msg}`;
}
</script>
</body>
</html>
