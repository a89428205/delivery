<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓智能決策演算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; font-size: 13px; }
        input { width: 35%; padding: 6px; text-align: right; }
        .calc-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 13px; }
        .calc-table td { padding: 5px; border-bottom: 1px solid #eee; }
        .result-highlight { background: #fff3cd; padding: 10px; text-align: center; font-weight: bold; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>熊貓智能決策器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    
    <div style="margin-top:15px;">
        <div class="form-group"><label>💰 金額：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🛣️ 里程：</label><input type="number" id="totalDistance" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🎁 小費：</label><input type="number" id="tips" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>🔥 加碼：</label><input type="number" id="bonus" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>📈 倍率：</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>
    </div>

    <table class="calc-table">
        <tr><td>廣告費 + 安全費</td><td>- 10 元</td></tr>
        <tr><td>小費</td><td id="dispTips">- 0 元</td></tr>
        <tr><td>任務加碼</td><td id="dispBonus">- 0 元</td></tr>
    </table>
    
    <div id="resultBox" class="result-highlight" style="display:none;"></div>
</div>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // 1. 動態搜尋「螢光綠」區塊重心 (自動對焦金額)
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            let sumX = 0, sumY = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) {
                // 鎖定螢光綠色 (r<100, g>150, b<100)
                if (data[i+1] > 150 && data[i+1] > data[i] + 30 && data[i+1] > data[i+2] + 30) {
                    sumX += (i/4) % canvas.width;
                    sumY += Math.floor((i/4) / canvas.width);
                    count++;
                }
            }

            if (count > 0) {
                const centerX = sumX / count;
                const centerY = sumY / count;
                // 以綠色區塊為中心裁切一個小矩形，專門識別金額
                const roiCanvas = document.createElement('canvas');
                const roiCtx = roiCanvas.getContext('2d');
                const w = 400, h = 150;
                roiCanvas.width = w; roiCanvas.height = h;
                roiCtx.drawImage(canvas, centerX - w/2, centerY - h/2, w, h, 0, 0, w, h);

                // 2. OCR 識別
                const { data: { text } } = await Tesseract.recognize(roiCanvas, 'eng', {
                    tessedit_char_whitelist: '0123456789.', 
                });
                const matches = text.match(/\d+(\.\d{1,2})?/);
                if (matches) document.getElementById('totalIncome').value = parseFloat(matches[0]);
            }
            
            // 3. 里程定位 (圓形與方形圖標)
            let shop = {x: 0, y: 0, c: 0}, cust = {x: 0, y: 0, c: 0};
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] < 30 && data[i+1] < 30 && data[i+2] < 30) {
                    let x = (i/4)%canvas.width, y = Math.floor((i/4)/canvas.width);
                    if (x < canvas.width/2) { shop.x += x; shop.y += y; shop.c++; }
                    else { cust.x += x; cust.y += y; cust.c++; }
                }
            }
            if (shop.c > 0 && cust.c > 0) {
                const dist = Math.sqrt(Math.pow(shop.x/shop.c - cust.x/cust.c, 2) + Math.pow(shop.y/shop.c - cust.y/cust.c, 2));
                document.getElementById('totalDistance').value = (dist * 0.0035).toFixed(1);
            }
            calculate();
        };
    };
    reader.readAsDataURL(file);
}

function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const dist = parseFloat(document.getElementById('totalDistance').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    document.getElementById('dispTips').innerText = `- ${tips} 元`;
    document.getElementById('dispBonus').innerText = `- ${bonus} 元`;
    
    if (dist > 0 && inc > 0) {
        const rawPay = (inc - 10 - tips - bonus) / mult;
        const perKm = rawPay / dist;
        const box = document.getElementById('resultBox');
        box.style.display = 'block';
        box.style.background = perKm >= 10 ? "#d4edda" : "#f8d7da";
        box.innerHTML = `每公里基礎單價：${perKm.toFixed(1)} 元<br>${perKm >= 10 ? "✅ 接單肥滋滋" : "❌ 這單坑人，別跑！"}`;
    }
}
</script>
</body>
</html>
