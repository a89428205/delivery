<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊貓報酬演算器 (最終決策版)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 480px; width: 100%; }
        h2 { text-align: center; color: #d70f64; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; font-size: 14px; width: 60%; }
        input { width: 35%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; text-align: right; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; font-size: 16px; display: none; line-height: 1.6; }
    </style>
</head>
<body>
<div class="container">
    <h2>📸 報酬演算器 (最終決策版)</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    
    <div class="form-group" style="margin-top: 15px;">
        <label>💰 自動金額 (元)：</label>
        <input type="number" id="totalIncome" step="0.1" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🎁 本單加碼金額 (元)：</label>
        <input type="number" id="bonus" value="0" step="0.1" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🛣️ 視覺里程 (公里)：</label>
        <input type="number" id="totalDistance" step="0.1" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🎯 每公里期望低標：</label>
        <input type="number" id="minPerKm" value="10" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>📈 倍率：</label>
        <input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()">
    </div>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const dist = parseFloat(document.getElementById('totalDistance').value) || 0;
    const minPerKm = parseFloat(document.getElementById('minPerKm').value) || 10;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    if (dist > 0 && inc > 0) {
        // 公式：(總金額 - 10元固定 - 加碼金額) / 倍率 = 原始配送費
        // 這樣計算出來的是「真正的基礎配送效能」
        const rawPay = (inc - 10 - bonus) / mult;
        const actualPerKm = rawPay / dist;
        const targetIncome = Math.round(((minPerKm * dist) * mult) + 10 + bonus);
        
        const box = document.getElementById('resultBox');
        box.style.display = 'block';
        box.style.background = actualPerKm >= minPerKm ? "#d4edda" : "#f8d7da";
        box.innerHTML = `本單應有(含加碼)：<b>${targetIncome} 元</b><br>
                         基礎單價：${actualPerKm.toFixed(1)} 元/km<br>
                         <b>${actualPerKm >= minPerKm ? "✅ 可以接單！" : "❌ 這單坑人，別送！"}</b>`;
    }
}
// (保持原有的 processImage 偵測金額與測距邏輯不變)
</script>
</body>
</html>
