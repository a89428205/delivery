<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓全能決策演算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #f7d7d7, #fde4e4, #ffffff); 
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; margin: 0;
        }
        .container { 
            background: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 20px; 
            max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 2px solid #ffbcbc;
        }
        h2 { text-align: center; color: #d32f2f; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; font-size: 14px; color: #555; }
        input { width: 40%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; text-align: right; }
        .result-highlight { 
            background: #fff3cd; padding: 15px; text-align: center; font-weight: bold; 
            margin-top: 20px; border-radius: 15px; border: 1px solid #ffeeba;
            font-size: 16px; color: #856404;
        }
        /* 隱藏進階參數 */
        .hidden-params { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>🐼 熊貓全能決策演算器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])" style="width:100%; margin-bottom:15px;">
    
    <div class="form-group"><label>💰 總金額：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>📍 藍點至店家 (km)：</label><input type="number" id="dist1" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>🛣️ 店家至顧客 (km)：</label><input type="number" id="dist2" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>🎁 小費：</label><input type="number" id="tips" value="15" oninput="calculate()"></div>
    <div class="form-group"><label>🔥 加碼：</label><input type="number" id="bonus" value="0" oninput="calculate()"></div>
    <div class="form-group"><label>📈 倍率：</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>

    <!-- 隱藏參數 (使用 image_5.png 的固定參數) -->
    <div class="hidden-params">
        <input type="number" id="cropY" value="0.53">
        <input type="number" id="factor1" value="0.0022">
        <input type="number" id="factor2" value="0.0023">
        <input type="number" id="offset2" value="0.4">
    </div>

    <div id="resultBox" class="result-highlight" style="display:none;"></div>
</div>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const cropYPos = parseFloat(document.getElementById('cropY').value);
            const roiCanvas = document.createElement('canvas');
            const rCtx = roiCanvas.getContext('2d');
            const roiH = canvas.height * 0.15;
            roiCanvas.width = canvas.width; roiCanvas.height = roiH;
            rCtx.drawImage(canvas, 0, canvas.height * cropYPos, canvas.width, roiH, 0, 0, canvas.width, roiH);
            
            const { data: { text } } = await Tesseract.recognize(roiCanvas, 'eng', { tessedit_char_whitelist: '0123456789.' });
            const matches = text.match(/\d+(\.\d{1,2})?/);
            if (matches) document.getElementById('totalIncome').value = parseFloat(matches[0]);

            const mapData = ctx.getImageData(0, 0, canvas.width, canvas.height * 0.6).data;
            const f1 = parseFloat(document.getElementById('factor1').value);
            const f2 = parseFloat(document.getElementById('factor2').value);
            const off2 = parseFloat(document.getElementById('offset2').value);
            let b={x:0,y:0,c:0}, s={x:0,y:0,c:0}, c={x:0,y:0,c:0};

            for (let i = 0; i < mapData.length; i += 4) {
                const x = (i/4)%canvas.width, y = Math.floor((i/4)/canvas.width);
                const r=mapData[i], g=mapData[i+1], b_val=mapData[i+2];
                if (b_val > 150 && r < 100) { b.x += x; b.y += y; b.c++; }
                else if (r < 50 && g < 50 && b_val < 50) {
                    if (y < canvas.height * 0.3) { s.x += x; s.y += y; s.c++; }
                    else { c.x += x; c.y += y; c.c++; }
                }
            }
            if(b.c>10 && s.c>10) document.getElementById('dist1').value = (Math.hypot(b.x/b.c - s.x/s.c, b.y/b.c - s.y/s.c) * f1).toFixed(1);
            if(s.c>10 && c.c>10) document.getElementById('dist2').value = (Math.hypot(s.x/s.c - c.x/c.c, s.y/s.c - c.y/c.c) * f2 + off2).toFixed(1);
            calculate();
        };
    };
    reader.readAsDataURL(file);
}

function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const d1 = parseFloat(document.getElementById('dist1').value) || 0;
    const d2 = parseFloat(document.getElementById('dist2').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    const totalDist = d1 + d2;
    const totalEarnings = inc + tips + bonus;
    const basePay = (totalEarnings - 10) / mult;
    const efficiency = totalDist > 0 ? (basePay / totalDist) : 0;
    
    let msg = efficiency >= 10 ? "✅ 去去去" : (efficiency >= 6 ? "⚠️ 有點硬" : "❌ 拒拒拒");
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.innerHTML = `總距離：${totalDist.toFixed(1)} km<br>每公里配送費：${efficiency.toFixed(1)} 元/km<br>${msg}`;
}
</script>
</body>
</html>
