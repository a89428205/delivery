<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓決策器 (手動校準版)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; font-size: 13px; }
        input { width: 35%; padding: 6px; text-align: right; }
        #debugCanvas { width: 100%; border: 2px dashed #d70f64; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>熊貓決策器 (偵測輔助版)</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    <p style="font-size:12px; color:#666;">如果下方沒出現綠色金額，請微調參數。</p>
    <canvas id="debugCanvas"></canvas>
    
    <div style="margin-top:15px;">
        <div class="form-group"><label>💰 偵測金額：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🛣️ 里程：</label><input type="number" id="totalDistance" step="0.1" oninput="calculate()"></div>
    </div>
</div>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // 【手動調整區】：如果你讀不到金額，把 0.65 改成 0.6 或 0.7 試試
            const cropY = canvas.height * 0.65; 
            const cropH = canvas.height * 0.1;
            
            const debugCanvas = document.getElementById('debugCanvas');
            debugCanvas.width = canvas.width;
            debugCanvas.height = cropH;
            debugCanvas.getContext('2d').drawImage(canvas, 0, cropY, canvas.width, cropH, 0, 0, canvas.width, cropH);

            const { data: { text } } = await Tesseract.recognize(debugCanvas, 'eng', {
                tessedit_char_whitelist: '0123456789.', 
            });
            
            const matches = text.match(/\d+(\.\d{1,2})?/);
            if (matches) {
                document.getElementById('totalIncome').value = parseFloat(matches[0]);
            }
            // 里程計算邏輯...
        };
    };
    reader.readAsDataURL(file);
}
// (後續計算函數不變)
</script>
</body>
</html>
