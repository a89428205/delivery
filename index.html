<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI外送計算器 (顯眼加碼版)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
        }
        h2 { text-align: center; color: #1d1d1f; margin-bottom: 15px; font-size: 20px; }
        
        .upload-zone {
            border: 2px dashed #0071e3;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background-color: #f0f7ff;
            cursor: pointer;
            margin-bottom: 15px;
        }
        #preview { max-width: 100%; max-height: 150px; margin-top: 10px; display: none; border-radius: 6px; }
        .status-loading { color: #0071e3; font-weight: bold; display: none; text-align: center; margin: 10px 0; }

        .order-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 10px; background: #eee; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s;
        }
        .tab-btn.active { background: #0071e3; color: white; }

        .section-title { font-size: 14px; color: #666; font-weight: bold; margin: 15px 0 5px 0; border-left: 3px solid #0071e3; padding-left: 6px;}
        .form-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; font-size: 14px; width: 60%; }
        input[type="number"] { width: 35%; padding: 6px; border: 1px solid #ccc; border-radius: 6px; text-align: right; font-size: 14px; }
        
        /* 🚨 新增：超級顯眼黃色加碼調整區 */
        .bonus-zone {
            background-color: #fff9e6; /* 明亮鮮黃色底 */
            border: 2px solid #f29100; /* 深橘色框線 */
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(242, 145, 0, 0.1);
        }
        .bonus-title {
            font-size: 16px;
            font-weight: bold;
            color: #d9381e;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 1px dashed #f29100;
            padding-bottom: 5px;
        }
        .bonus-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .bonus-group label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            width: 60%;
        }
        .bonus-group input[type="number"] {
            width: 35%;
            padding: 8px;
            border: 1px solid #f29100;
            border-radius: 6px;
            text-align: right;
            font-size: 14px;
            background-color: white;
        }

        .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; }
        .status-pass { background-color: #e2f5ea; color: #137333; border: 1px solid #137333; }
        .status-fail { background-color: #fce8e6; color: #c5221f; border: 1px solid #c5221f; }
        .big-text { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .detail-text { font-size: 13px; color: #444; line-height: 1.6; text-align: left; background: #fafafa; padding: 10px; border-radius: 6px; margin-top: 10px;}
        .highlight { color: #d9381e; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 AI外送計算器 (顯眼加碼版)</h2>
    
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <span id="uploadText">點擊上傳 / 貼上「派單截圖」</span>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this.files[0])">
        <br><img id="preview" alt="預覽">
    </div>
    <div id="loadingStatus" class="status-loading">🔍 AI 正在識別總金額與總里程... <span id="progress">0%</span></div>

    <div class="bonus-zone">
        <div class="bonus-title">🔥 餐期加碼調整區 (手動)</div>
        <div class="bonus-group">
            <label>📈 加碼倍率 (如 1.2)：</label>
            <input type="number" id="multiplier" value="1.0" step="0.1" oninput="calculate()">
        </div>
        <div class="bonus-group">
            <label>💵 每單加價 (元)：</label>
            <input type="number" id="orderBonus" value="0" oninput="calculate()">
        </div>
    </div>

    <label style="width: 100%; margin-bottom: 8px; font-weight: bold; font-size: 14px;">這趟任務總共有幾單？</label>
    <div class="order-tabs">
        <button class="tab-btn active" onclick="switchOrderCount(1)">單張單</button>
        <button class="tab-btn" onclick="switchOrderCount(2)">雙拼單 (2單)</button>
        <button class="tab-btn" onclick="switchOrderCount(3)">三拼單 (3單)</button>
    </div>

    <div class="section-title" style="border-left-color: #f29100;">本次任務數據</div>
    <div class="form-group">
        <label>💰 畫面顯示總金額 (元)：</label>
        <input type="number" id="totalIncome" value="0" oninput="calculate()">
    </div>
    <div class="form-group" style="background: #fff9e6; padding: 4px; border-radius: 6px;">
        <label>🎁 內含客戶小費/賞金 (元)：</label>
        <input type="number" id="tips" value="0" style="border-color: #f29100;" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🛣️ 任務總總里程 (公里)：</label>
        <input type="number" id="totalDistance" value="0" step="0.1" oninput="calculate()">
    </div>

    <div class="section-title">時間與時薪成本</div>
    <div class="form-group">
        <label>⏱️ 單張單基本固定耗時 (分)：</label>
        <input type="number" id="baseFixTime" value="10" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>➕ 每多送一單增加耗時 (分)：</label>
        <input type="number" id="extraFixTime" value="7" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🏍️ 預估均速 (公里/小時)：</label>
        <input type="number" id="speed" value="30" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🎯 你的目標時薪 (元)：</label>
        <input type="number" id="targetWage" value="200" oninput="calculate()">
    </div>

    <div id="resultBox" class="result-box status-pass" style="display:none;">
        <div id="hourlyWage" class="big-text">0 元/小時</div>
        <div id="details" class="detail-text"></div>
    </div>
</div>

<script>
let currentOrders = 1;

document.addEventListener('paste', function (e) {
    const items = e.clipboardData.items;
    for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) { handleImage(items[i].getAsFile()); }
    }
});

function switchOrderCount(count) {
    currentOrders = count;
    const buttons = document.querySelectorAll('.tab-btn');
    buttons.forEach((btn, index) => {
        if (index === count - 1) btn.classList.add('active');
        else btn.classList.remove('active');
    });
    calculate();
}

function handleImage(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const preview = document.getElementById('preview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        document.getElementById('uploadText').innerText = "更換圖片";
    }
    reader.readAsDataURL(file);

    const loadingStatus = document.getElementById('loadingStatus');
    const progressSpan = document.getElementById('progress');
    loadingStatus.style.display = 'block';
    progressSpan.innerText = "0%";

    Tesseract.recognize(file, 'eng', { logger: m => {
        if(m.status === 'recognizing') progressSpan.innerText = Math.round(m.progress * 100) + "%";
    }}).then(({ data: { text } }) => {
        loadingStatus.style.display = 'none';
        parseTextToData(text);
    }).catch(err => {
        loadingStatus.style.display = 'none';
        alert("掃描失敗，請手動輸入數據。");
    });
}

function parseTextToData(rawText) {
    const text = rawText.toLowerCase().replace(/[^0-9.\n]/g, ' '); 
    const lines = text.split('\n');
    let numbers = [];
    
    lines.forEach(line => {
        const tokens = line.split(/\s+/);
        tokens.forEach(token => {
            const num = parseFloat(token);
            if (!isNaN(num) && num > 0) numbers.push(num);
        });
    });

    let detectedIncome = 0;
    let detectedDistance = 0;

    const decimals = numbers.filter(n => n % 1 !== 0 && n < 40);
    if (decimals.length > 0) {
        detectedDistance = decimals[0];
        const integers = numbers.filter(n => n % 1 === 0 && n >= 30 && n <= 600);
        if (integers.length > 0) detectedIncome = integers[0];
    } else {
        const validNums = numbers.filter(n => n < 600);
        if (validNums.length >= 2) {
            validNums.sort((a, b) => b - a);
            detectedIncome = validNums[0];
            detectedDistance = validNums[1];
        } else if (validNums.length === 1) {
            detectedIncome = validNums[0];
        }
    }

    if (detectedIncome) document.getElementById('totalIncome').value = Math.round(detectedIncome);
    if (detectedDistance) document.getElementById('totalDistance').value = detectedDistance;

    // AI辨識完成後預設加碼為 1.0 倍 / 0 元
    document.getElementById('multiplier').value = 1.0;
    document.getElementById('orderBonus').value = 0;
    document.getElementById('tips').value = 0;

    calculate();
}

function calculate() {
    const totalIncome = parseFloat(document.getElementById('totalIncome').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const totalDistance = parseFloat(document.getElementById('totalDistance').value) || 0;
    
    // 🔥 新增：加碼倍率與每單加價手動數據
    const globalMultiplier = parseFloat(document.getElementById('multiplier').value) || 1.0;
    const perOrderBonus = parseFloat(document.getElementById('orderBonus').value) || 0;

    const baseFixTime = parseFloat(document.getElementById('baseFixTime').value) || 0;
    const extraFixTime = parseFloat(document.getElementById('extraFixTime').value) || 0;
    const speed = parseFloat(document.getElementById('speed').value) || 30;
    const targetWage = parseFloat(document.getElementById('targetWage').value) || 0;

    if (totalIncome === 0 && totalDistance === 0) return;

    // 💡 扣除小費，再算出真正由平台給的總車資 (基礎 + 加碼)
    // 公式：(總金額 - 小費) * 倍率 + (每單加價 * 張數)
    const totalPlatformIncome = ((totalIncome - tips) * globalMultiplier) + (perOrderBonus * currentOrders);

    // 時間與時薪計算
    const totalFixTime = baseFixTime + ((currentOrders - 1) * extraFixTime);
    const rideTime = (totalDistance / speed) * 60; 
    const totalTime = rideTime + totalFixTime; 

    // 用「算入加碼、扣除小費」後的平台收入來計算等效時薪
    let estimatedHourlyWage = 0;
    if (totalTime > 0) {
        estimatedHourlyWage = Math.round((totalPlatformIncome / totalTime) * 60);
    }

    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    document.getElementById('hourlyWage').innerText = estimatedHourlyWage + " 元/小時";
    
    let tipsText = tips > 0 ? `<br>🎁 <strong>扣除客戶小費：</strong> -${tips} 元` : '';
    let bonusText = '';
    if (globalMultiplier !== 1 || perOrderBonus !== 0) {
        bonusText = `<br>🔥 <strong>加碼計算：</strong> 放大 ${globalMultiplier} 倍 + 額外獎金 ${perOrderBonus * currentOrders} 元`;
    }

    document.getElementById('details').innerHTML = `
        📊 <strong>本次任務總單數：</strong> ${currentOrders} 單<br>
        🛣️ <strong>總總總里程：</strong> ${totalDistance.toFixed(1)} 公里<br>
        💰 <strong>畫面總金額：</strong> ${totalIncome} 元${tipsText}${bonusText}<br>
        💵 <strong>實質平台收入：</strong> <span class="highlight">${Math.round(totalPlatformIncome)}</span> 元<br>
        ⏱️ <strong>預估總耗時：</strong> ${Math.round(totalTime)} 分鐘 <br>
        🚗 <strong>每公里均價產值：</strong> ${(totalPlatformIncome / (totalDistance || 1)).toFixed(1)} 元/公里
    `;

    if (estimatedHourlyWage >= targetWage) {
        resultBox.className = "result-box status-pass";
    } else {
        resultBox.className = "result-box status-fail";
    }
}
</script>

</body>
</html>
