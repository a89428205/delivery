<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓全能決策演算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; font-size: 13px; }
        input { width: 35%; padding: 6px; text-align: right; }
        .calc-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 13px; }
        .calc-table td { padding: 5px; border-bottom: 1px solid #eee; }
        .result-highlight { background: #fff3cd; padding: 10px; text-align: center; font-weight: bold; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>熊貓全能演算器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    
    <div style="margin-top:15px;">
        <div class="form-group"><label>💰 總金額(自動)：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🔍 偵測高度：</label><input type="number" id="cropY" value="0.60" step="0.05" oninput="calculate()"></div>
        <div class="form-group"><label>📍 藍點至店家 (km)：</label><input type="number" id="dist1" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🛣️ 店家至顧客 (km)：</label><input type="number" id="dist2" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🎁 小費：</label><input type="number" id="tips" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>🔥 加碼：</label><input type="number" id="bonus" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>📈 倍率：</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>
    </div>

    <table class="calc-table">
        <tr><td>廣告費 + 安全費</td><td>- 10 元</td></tr>
        <tr><td>總行駛距離</td><td id="dispTotalDist">0.0 km</td></tr>
    </table>
    
    <div id="resultBox" class="result-highlight" style="display:none;"></div>
</div>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // 1. 金額自動辨識 (保持裁切與綠色濾鏡)
            const cropYPos = parseFloat(document.getElementById('cropY').value) || 0.60;
            const roiCanvas = document.createElement('canvas');
            const roiCtx = roiCanvas.getContext('2d');
            roiCanvas.width = canvas.width * 2; roiCanvas.height = (canvas.height * 0.15) * 2;
            roiCtx.scale(2, 2);
            roiCtx.drawImage(canvas, 0, canvas.height * cropYPos, canvas.width, canvas.height * 0.15, 0, 0, canvas.width, canvas.height * 0.15);
            
            const imgData = roiCtx.getImageData(0, 0, roiCanvas.width, roiCanvas.height);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                if (d[i+1] > 140 && d[i+1] > d[i] + 30 && d[i+1] > d[i+2] + 30) d[i]=d[i+1]=d[i+2]=0;
                else d[i]=d[i+1]=d[i+2]=255;
            }
            roiCtx.putImageData(imgData, 0, 0);
            const { data: { text } } = await Tesseract.recognize(roiCanvas, 'eng', {tessedit_char_whitelist: '0123456789.'});
            const matches = text.match(/\d+(\.\d{1,2})?/);
            if (matches) document.getElementById('totalIncome').value = parseFloat(matches[0]);

            // 2. 三點定位邏輯 (藍點-店家-顧客)
            const mapData = ctx.getImageData(0, 0, canvas.width, canvas.height * 0.6).data;
            let blue={x:0,y:0,c:0}, shop={x:0,y:0,c:0}, cust={x:0,y:0,c:0};
            for (let i = 0; i < mapData.length; i += 4) {
                const r=mapData[i], g=mapData[i+1], b=mapData[i+2];
                if (b > 150 && b > r + 40) { blue.x += (i/4)%canvas.width; blue.y += Math.floor((i/4)/canvas.width); blue.c++; }
                else if (r < 50 && g < 50 && b < 50) { shop.x += (i/4)%canvas.width; shop.y += Math.floor((i/4)/canvas.width); shop.c++; }
                else if (r > 200 && g < 100 && b > 100) { cust.x += (i/4)%canvas.width; cust.y += Math.floor((i/4)/canvas.width); cust.c++; }
            }
            if(blue.c>0 && shop.c>0) document.getElementById('dist1').value = (Math.hypot(blue.x/blue.c - shop.x/shop.c, blue.y/blue.c - shop.y/shop.c) * 0.0035).toFixed(1);
            if(shop.c>0 && cust.c>0) document.getElementById('dist2').value = (Math.hypot(shop.x/shop.c - cust.x/cust.c, shop.y/shop.c - cust.y/cust.c) * 0.0035).toFixed(1);
            calculate();
        };
    };
    reader.readAsDataURL(file);
}

function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const d1 = parseFloat(document.getElementById('dist1').value) || 0;
    const d2 = parseFloat(document.getElementById('dist2').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    const totalDist = d1 + d2;
    document.getElementById('dispTotalDist').innerText = `${totalDist.toFixed(1)} km`;
    
    const laborPay = inc - tips - bonus;
    const isIllegal = laborPay < 45;
    const perKm = totalDist > 0 ? (laborPay / mult / totalDist) : 0;
    
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.style.background = isIllegal ? "#ffcccc" : (perKm >= 10 ? "#d4edda" : "#f8d7da");
    box.innerHTML = `每公里單價：${perKm.toFixed(1)} 元<br>${isIllegal ? "⚠️ 低於45元法定底價" : (perKm >= 10 ? "✅ 划算單" : "❌ 坑人單")}`;
}
</script>
</body>
</html>
