<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓精準金額演算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: bold; font-size: 13px; }
        input { width: 35%; padding: 6px; text-align: right; }
        .result-highlight { background: #fff3cd; padding: 10px; text-align: center; font-weight: bold; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>熊貓全能演算器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    
    <div style="margin-top:15px;">
        <div class="form-group"><label>💰 總金額(自動)：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🛣️ 里程(自動)：</label><input type="number" id="totalDistance" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🎁 小費(手動)：</label><input type="number" id="tips" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>🔥 加碼(手動)：</label><input type="number" id="bonus" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>📈 倍率：</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>
    </div>
    
    <div id="resultBox" class="result-highlight" style="display:none;"></div>
</div>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // 【關鍵修正】：只取圖片下半部 (金額區域)，避開上方地圖雜訊
            // 根據您的截圖，金額大約在 Y軸 65% 到 75% 之間，寬度 30% 到 70%
            const cropX = canvas.width * 0.3;
            const cropY = canvas.height * 0.65;
            const cropW = canvas.width * 0.4;
            const cropH = canvas.height * 0.1;
            
            const roiCanvas = document.createElement('canvas');
            roiCanvas.width = cropW;
            roiCanvas.height = cropH;
            roiCtx = roiCanvas.getContext('2d');
            roiCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            // 對裁切區域做顏色過濾
            const imgData = roiCtx.getImageData(0, 0, cropW, cropH);
            const d = imgData.data;
            for (let i = 0; i < d.length; i += 4) {
                // 只有「綠色」保留，其餘變白
                if (d[i+1] > 150 && d[i+1] > d[i] + 30 && d[i+1] > d[i+2] + 30) {
                    d[i] = d[i+1] = d[i+2] = 0; // 黑
                } else {
                    d[i] = d[i+1] = d[i+2] = 255; // 白
                }
            }
            roiCtx.putImageData(imgData, 0, 0);

            // OCR
            const { data: { text } } = await Tesseract.recognize(roiCanvas, 'eng', {
                tessedit_char_whitelist: '0123456789.', 
            });
            const matches = text.match(/\d+(\.\d{1,2})?/);
            if (matches) document.getElementById('totalIncome').value = parseFloat(matches[0]);
            
            calculate();
        };
    };
    reader.readAsDataURL(file);
}

function calculate() {
    // (邏輯與之前相同，保持不變)
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const dist = parseFloat(document.getElementById('totalDistance').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    if (dist > 0 && inc > 0) {
        const rawPay = (inc - 10 - tips - bonus) / mult;
        const perKm = rawPay / dist;
        const box = document.getElementById('resultBox');
        box.style.display = 'block';
        box.style.background = perKm >= 10 ? "#d4edda" : "#f8d7da";
        box.innerHTML = `每公里基礎單價：${perKm.toFixed(1)} 元<br>${perKm >= 10 ? "✅ 接單肥滋滋" : "❌ 這單坑人，別跑！"}`;
    }
}
</script>
</body>
</html>
