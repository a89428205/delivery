<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓全能決策計算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input { width: 40%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: right; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; font-size: 16px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>熊貓全能決策器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
    
    <div style="margin-top:15px;">
        <div class="form-group"><label>💰 總金額(自動)：</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🛣️ 里程(自動)：</label><input type="number" id="totalDistance" step="0.1" oninput="calculate()"></div>
        <div class="form-group"><label>🎁 小費(手動)：</label><input type="number" id="tips" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>🔥 單單加碼(手動)：</label><input type="number" id="bonus" value="0" oninput="calculate()"></div>
        <div class="form-group"><label>📈 倍率：</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>
    </div>
    <div id="resultBox" class="result-box"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
async function processImage(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async () => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width; canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            // 定位：黑色圓形(起始)與粉紅方形(終點)
            let start = {x: 0, y: 0, c: 0}, end = {x: 0, y: 0, c: 0};
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] < 40 && data[i+1] < 40 && data[i+2] < 40) { // 黑色圓形
                    start.x += (i/4)%canvas.width; start.y += Math.floor((i/4)/canvas.width); start.c++;
                } else if (data[i] > 200 && data[i+1] < 80 && data[i+2] > 150) { // 粉紅方形
                    end.x += (i/4)%canvas.width; end.y += Math.floor((i/4)/canvas.width); end.c++;
                }
            }
            if (start.c > 0 && end.c > 0) {
                const dist = Math.sqrt(Math.pow(start.x/start.c - end.x/end.c, 2) + Math.pow(start.y/start.c - end.y/end.c, 2));
                document.getElementById('totalDistance').value = (dist * 0.0035).toFixed(1);
            }

            const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
            const matches = text.match(/\d+(\.\d+)?/g);
            if (matches) document.getElementById('totalIncome').value = parseFloat(matches[0]);
            calculate();
        };
    };
    reader.readAsDataURL(file);
}

function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const dist = parseFloat(document.getElementById('totalDistance').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const bonus = parseFloat(document.getElementById('bonus').value) || 0;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    if (dist > 0 && inc > 0) {
        // 核心公式：扣除廣告安全費(10)、小費、加碼後，再除倍率
        const rawPay = (inc - 10 - tips - bonus) / mult;
        const perKm = rawPay / dist;
        const box = document.getElementById('resultBox');
        box.style.display = 'block';
        box.style.background = perKm >= 10 ? "#d4edda" : "#f8d7da";
        box.innerHTML = `每公里基礎單價: <b>${perKm.toFixed(1)}</b> 元<br>
                         <b>${perKm >= 10 ? "✅ 可以接單！" : "❌ 這單坑人！"}</b>`;
    }
}
</script>
</body>
</html>
