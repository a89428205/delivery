<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>熊貓官方報酬演算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f5f5f7; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        #resultBox { padding: 15px; margin-top: 20px; border-radius: 8px; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>📸 熊貓報酬演算器</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="handleImage(this.files[0])">
    
    <div class="form-group"><label>💰 原始金額 (元):</label><input type="number" id="totalIncome" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>🛣️ 里程 (公里):</label><input type="number" id="totalDistance" step="0.1" oninput="calculate()"></div>
    <div class="form-group"><label>📈 倍率 (如 1.35):</label><input type="number" id="multiplier" value="1.35" step="0.01" oninput="calculate()"></div>
    
    <div id="resultBox" class="result"></div>
</div>

<script>
async function handleImage(file) {
    const { data: { text } } = await Tesseract.recognize(file, 'eng');
    const nums = text.match(/\d+(\.\d+)?/g)?.map(Number) || [];
    
    const income = Math.max(...nums.filter(n => n > 20 && n < 500));
    if (income > 0) document.getElementById('totalIncome').value = income;
    
    const dists = nums.filter(n => n >= 0.5 && n <= 15 && n % 1 !== 0);
    if (dists.length > 0) document.getElementById('totalDistance').value = dists[0];
    
    calculate();
}

function calculate() {
    const inc = parseFloat(document.getElementById('totalIncome').value) || 0;
    const dist = parseFloat(document.getElementById('totalDistance').value) || 0;
    const mult = parseFloat(document.getElementById('multiplier').value) || 1.35;
    
    if (dist > 0 && inc > 0) {
        // 核心公式：(金額 - 10) / 倍率 = 原始配送費
        const rawPay = (inc - 10) / mult;
        const perKm = rawPay / dist;
        
        const box = document.getElementById('resultBox');
        box.style.display = 'block';
        box.style.background = perKm >= 10 ? "#d4edda" : "#f8d7da";
        box.innerHTML = `<h3>每公里原始: ${perKm.toFixed(1)} 元</h3>` + 
                        (perKm >= 10 ? "🟢 划算單" : "🔴 坑人單");
    }
}
</script>
</body>
</html>
