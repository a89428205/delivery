<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊貓專業版報酬計算器</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 480px; width: 100%; }
        h2 { text-align: center; color: #d70f64; margin-bottom: 15px; font-size: 20px; }
        .upload-zone { border: 2px dashed #d70f64; padding: 15px; text-align: center; border-radius: 8px; background-color: #fff0f5; cursor: pointer; margin-bottom: 15px; }
        #preview { max-width: 100%; max-height: 150px; margin-top: 10px; display: none; border-radius: 6px; }
        .form-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; font-size: 14px; width: 65%; }
        input[type="number"] { width: 30%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; text-align: right; font-size: 14px; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>📸 報酬計算器 (手動優先版)</h2>
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <span id="uploadText">點擊上傳截圖</span>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this.files[0])">
        <br><img id="preview" alt="預覽">
    </div>
    
    <div class="form-group">
        <label>💰 原始金額 (元)：</label>
        <input type="number" id="totalIncome" value="0" step="0.1" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🎁 手動輸入小費 (元)：</label>
        <input type="number" id="tips" value="0" step="0.1" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>🛣️ 總里程 (公里)：</label>
        <input type="number" id="totalDistance" value="0" step="0.1" oninput="calculate()">
    </div>

    <div id="resultBox" class="result-box">
        <div id="verdictText" style="font-size: 20px; font-weight: bold;">--</div>
        <div id="actualResult" style="font-size: 24px; font-weight: bold; margin: 10px 0;">--</div>
    </div>
</div>

<script>
async function handleImage(file) {
    const reader = new FileReader();
    reader.onload = (e) => { 
        document.getElementById('preview').src = e.target.result; 
        document.getElementById('preview').style.display = 'block'; 
    };
    reader.readAsDataURL(file);

    try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        const matches = text.match(/\d+(\.\d+)?/g);
        if (matches) {
            // 只取 10~500 之間的數字，避免抓到雜訊
            const candidates = matches.map(Number).filter(n => n > 10 && n < 500);
            if (candidates.length > 0) {
                document.getElementById('totalIncome').value = Math.max(...candidates);
                calculate();
            }
        }
    } catch (err) {
        console.error("偵測失敗，請手動輸入");
    }
}

function calculate() {
    const rawIncome = parseFloat(document.getElementById('totalIncome').value) || 0;
    const tips = parseFloat(document.getElementById('tips').value) || 0;
    const dist = parseFloat(document.getElementById('totalDistance').value) || 0;
    
    if (dist <= 0 || rawIncome <= 0) return;

    const fixedBonus = 10; 
    const rawPay = (rawIncome - fixedBonus) / 1.35;
    const payPerKm = rawPay / dist;
    
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    document.getElementById('actualResult').innerText = "每公里原始: " + payPerKm.toFixed(1) + " 元";
    box.style.backgroundColor = payPerKm >= 10 ? "#e2f5ea" : "#fce8e6";
    document.getElementById('verdictText').innerText = payPerKm >= 10 ? "🟢 划算" : "🔴 不划算";
}
</script>
</body>
</html>
